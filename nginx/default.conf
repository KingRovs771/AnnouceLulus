server {
    listen 80;
    server_name localhost; # Ganti dengan domain Anda jika ada

    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html; # Penting untuk SPA (Single Page Application) Vue
    }

    # Proxy ke backend Express.js
    location /api/ { # Sesuaikan dengan prefix API Anda, misal: /api/users
        proxy_pass http://backend:3000; # 'backend' adalah nama service Express.js di docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}